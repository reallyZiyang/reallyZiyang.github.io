---
layout: default
---

<article class="post">
  <header class="post-header">
    {% if page.series_title %}
      <p class="article-tag">{{ page.series_title }} {{ page.series_order | prepend: "00" | slice: -2, 2 }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-lead">{{ page.description }}</p>
    {% endif %}
    <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
  </header>

  {{ content }}
</article>
